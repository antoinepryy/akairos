# Builds the Bedrock image (images/bedrock-site) and pushes it to the GitHub
# container registry, tagged with the short commit sha. Kubernetes pulls
# images from a registry (on Swarm they were built on every node).
# Then: set wordpress.image in apps/bedrock/values.yaml to the new tag and push.
name: bedrock-image

on:
  push:
    paths:
      - images/bedrock-site/**
      - .github/workflows/bedrock-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/bedrock-site
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/akairos-bedrock-site:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/akairos-bedrock-site:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "image ghcr.io/${{ github.repository_owner }}/akairos-bedrock-site:${{ steps.tag.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
