# MariaDB Galera, run by mariadb-operator (installed by bedrock/main.tf). It
# replaces the hand-written galera-N services and ProxySQL of the Swarm demo:
# the operator bootstraps the cluster, recovers it after a full stop, and
# points the Service bedrock-db-primary at a healthy node (writes) when the
# current one fails.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: bedrock-db
spec:
  replicas: {{ .Values.galera.replicas }}
  # Generated by the operator into the Secret bedrock-db on first sync.
  rootPasswordSecretKeyRef: { name: bedrock-db, key: root-password, generate: true }
  storage:
    size: {{ .Values.galera.storageSize }}
    # Demo: removing the app removes its volumes (OVH block storage, billed
    # until deleted). A production keeps them (Retain) and has backups.
    pvcRetentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
  galera:
    enabled: true
    primary:
      autoFailover: true
    replPasswordSecretKeyRef: { name: bedrock-db, key: repl-password, generate: true }
    # Pod Security "restricted" also applies to the operator's init and agent
    # containers; giving them a securityContext requires naming their image.
    agent:
      image: {{ .Values.galera.operatorImage }}
      securityContext:
        {{- include "bedrock.containerSecurity" . | nindent 8 }}
    initContainer:
      image: {{ .Values.galera.operatorImage }}
      securityContext:
        {{- include "bedrock.containerSecurity" . | nindent 8 }}
  {{- if .Values.galera.antiAffinity }}
  # One Galera pod per node: losing a node loses one copy.
  affinity:
    antiAffinityEnabled: true
  {{- end }}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    {{- include "bedrock.containerSecurity" . | nindent 4 }}
  # Draining a node may take one Galera pod at a time, never two.
  podDisruptionBudget:
    maxUnavailable: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }
  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=256M
    max_allowed_packet=64M
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: wordpress
spec:
  mariaDbRef: { name: bedrock-db }
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: wordpress
spec:
  mariaDbRef: { name: bedrock-db }
  # Same password as WordPress' DB_PASSWORD (scripts/bedrock-secrets.sh).
  passwordSecretKeyRef: { name: bedrock-env, key: DB_PASSWORD }
  host: "%"
  maxUserConnections: 100
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: wordpress
spec:
  mariaDbRef: { name: bedrock-db }
  privileges: ["ALL PRIVILEGES"]
  database: wordpress
  table: "*"
  username: wordpress
  host: "%"
