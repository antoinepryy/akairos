apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    # Kubernetes asks OVH for an Octavia load balancer with a floating IP.
    loadbalancer.ovhcloud.com/flavor: small
    loadbalancer.openstack.org/load-balancer-name: {{ .Values.loadBalancerName }}
spec:
  type: LoadBalancer
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: http }
