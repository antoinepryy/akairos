# Nothing reaches the pods of this namespace unless a policy allows it...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# ...and the web pods only take HTTP on their port (from the load balancer,
# through the nodes, so from any source).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-http
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }
