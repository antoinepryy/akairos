replicas: 3

# Shown on the page. Change version + color for a visible rolling update.
version: v2
color: "#16a34a"

image: nginx:1.30-alpine

# Name of the OVH load balancer created for the Service (found by check-leftovers).
loadBalancerName: akairos-k8s-web
