<VirtualHost *:8080>
    DocumentRoot /var/www/html/web
    ServerName localhost

    # Real client IP from Traefik (pod network)
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8

    # Readiness probe (Kubernetes): 503 until the container is warm
    Alias /healthz /var/www/healthz.php
    <Location /healthz>
        Require all granted
    </Location>

    PassEnv HOSTNAME
    # Expose which pod served the request (shows load balancing across replicas)
    Header always set X-Served-By "%{HOSTNAME}e"

    <Directory /var/www/html/web>
        AllowOverride None
        Require all granted
        Options -Indexes
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Composer files are outside the web root; block dotfiles anyway
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
